<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>cascadecoop</title>
  </head>
  <body class="app">
    <div class="content">
      <h1 class="title" id="title"></h1>
      <p class="description" id="description">
        Build a Rube-Goldberg machine with your community. Place one piece per day and watch marbles cascade.
      </p>
      <div class="pieces-preview">
        <span class="piece-chip ramp">Ramp</span>
        <span class="piece-chip bumper">Bumper</span>
        <span class="piece-chip well">Gravity Well</span>
        <span class="piece-chip slide">Slide</span>
        <span class="piece-chip block">Block</span>
      </div>
    </div>
    <div>
      <button class="start-button" id="start-button">Play</button>
    </div>
    <script type="module" src="splash.ts" defer></script>
  </body>
</html>
